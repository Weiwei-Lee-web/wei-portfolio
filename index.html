.wcard{min-width:0;padding:0;border:none;background:none;cursor:pointer;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:stretch;text-align:center;transition:opacity .9s var(--e-out)}

<script src="js/wei-runtime.js"></script>
<script>
(function (DCLogic, StreamableLogic, React) {

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      page: 'home', sel: null, beat: 0, intro: true, rv: {},
      ticket: false, ahead: 4, called: false, tab: 'order', qty: [0, 0, 0, 0], ordered: false,
      game: false, gPaused: false, score: 0, left: 12, cell: -1, best: 0
    };
    this.x = 0; this.v = 0; this.boost = 0; this.skew = 0; this.last = 0; this.raf = 0; this.hover = false;
    this.frame = this.frame.bind(this);
    this.beltDown = this.beltDown.bind(this);
    this.dragging = false; this.dragMoved = false; this.flinging = false; this.pv = 0;
    this.hMode = 'M2';   // HERO_MODE: M1 進場顯影 / M2 移焦溶接 / M3 定時換格 (the only difference between M1, M2 and M3)
    this.fxTick = this.fxTick.bind(this); this.pxTick = this.pxTick.bind(this);
  }
  componentDidMount() {
    this.rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this.lastY = window.scrollY || 0;
    this.onScroll = () => {
      const y = window.scrollY || 0;
      const dy = y - this.lastY;
      this.lastY = y;
      this.boost = Math.min(10, this.boost + Math.abs(dy) * 0.05);
      this.kick();
    };
    this.onVis = () => { if (!document.hidden) this.kick(); this.hSync(); if (document.hidden) this.gStopVid(); else this.gAuto(); };
    this.introT = setTimeout(() => this.setState({ intro: false }), this.rm ? 0 : 3200);
    this.onKey = (ev) => {
      if (!this.state.sel) return;
      if (ev.key === 'Escape') {
        ev.preventDefault();
        if (this.state.zoom) { this.setState({ zoom: false }); const zf = document.querySelector('.dz .zf.p'); if (zf) zf.focus({ preventScroll: true }); }
        else this.closeSheet();
        return;
      }
      if (this.state.zoom || (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft')) return;
      const d = ev.key === 'ArrowRight' ? 1 : -1;
      const a = document.activeElement;
      if (a && a.closest && a.closest('.dz .zf.p')) { ev.preventDefault(); this.zPageStep(d); return; }
      this.stepWork(d);
    };
    window.addEventListener('keydown', this.onKey);
    this.qzInit();
    this.pvInit();
    this.initReveal();
    this.hInit();
    this.gBind();
    window.addEventListener('scroll', this.onScroll, { passive: true });
    document.addEventListener('visibilitychange', this.onVis);
    this.kick();
  }
  componentDidUpdate() {
    this.kick(); this.hBind(); this.initReveal(); this.hSync();
    this.pvSync(); this.gBind();
    this.zSwipeBind();
    this.qzSync();
    if (this._zPre && this.state.phase === 'pre') { this._zPre = false; this.zRunOpen(); }
    if (this._zIn) { const out = this._zIn; this._zIn = null; this.zRunIn(out); }
    if (this._zAfter && !this.state.sel) { const f = this._zAfter; this._zAfter = null; f(); }
  }
  initReveal() {
    const els = document.querySelectorAll('[data-rv]');
    const done = this.state.rv || {};
    if (this.rm || !('IntersectionObserver' in window)) {
      const all = {}; let add = false;
      els.forEach((e) => { const k = e.getAttribute('data-rv'); all[k] = true; if (!done[k]) add = true; });
      if (add) this.setState({ rv: Object.assign({}, done, all) });
      return;
    }
    if (!this.io) {
      this.io = new IntersectionObserver((es) => {
        const add = {}; let any = false;
        es.forEach((e) => { if (e.isIntersecting) { add[e.target.getAttribute('data-rv')] = true; any = true; this.io.unobserve(e.target); } });
        if (any) this.setState({ rv: Object.assign({}, this.state.rv || {}, add) });
      }, { rootMargin: '0px 0px -12% 0px', threshold: 0.15 });
    }
    els.forEach((e) => { if (!done[e.getAttribute('data-rv')]) this.io.observe(e); });
    const hero = document.querySelector('.hero3');
    if (hero && hero !== this._heroEl) {
      this._heroEl = hero;
      if (this.heroIO) this.heroIO.disconnect();
      this.heroIO = new IntersectionObserver((es) => { const off = !es[0].isIntersecting; if (off !== !!this.heroOff) { this.heroOff = off; const h = document.querySelector('.hero3'); if (h) h.classList.toggle('off', off); this.hSync(); } });
      this.heroIO.observe(hero);
    }
  }
  closeSheet() { this.zClose(); }
  /* ---------- 延伸應用 phone: small at rest, 原位展開 to a centred overlay (FLIP, same node) ---------- */
  qzEls() {
    const ph = document.querySelector('#queue .q-ph');
    if (!ph) return null;
    return { ph, btn: ph.querySelector('.q-pbtn'), slot: ph.querySelector('.q-slot'), pop: ph.querySelector('.q-pop'), veil: ph.querySelector('.q-veil'), x: ph.querySelector('.q-x') };
  }
  qzInit() {
    this.qz = { open: false, busy: false, want: null, anims: [], inerted: [] };
    this.onQzClick = (ev) => {
      const t = ev.target;
      if (!t || !t.closest) return;
      if (t.closest('#queue .q-pbtn')) { ev.preventDefault(); this.qzOpen(); return; }
      if (t.closest('#queue .q-veil')) { ev.preventDefault(); this.qzClose(ev.detail === 0); }
    };
    this.onQzKey = (ev) => {
      if (!this.qz || !this.qz.open) return;
      if (ev.key === 'Escape') { ev.preventDefault(); ev.stopImmediatePropagation(); this.qzClose(true); }
    };
    this.onQzResize = () => { if (this.qz && this.qz.open) { const e = this.qzEls(); if (e) e.pop.style.setProperty('--qs', String(this.qzFit())); } };
    document.addEventListener('click', this.onQzClick);
    window.addEventListener('keydown', this.onQzKey, true);
    window.addEventListener('resize', this.onQzResize);
    this.qzSync();
  }
  qzTeardown() {
    if (this.onQzClick) document.removeEventListener('click', this.onQzClick);
    if (this.onQzKey) window.removeEventListener('keydown', this.onQzKey, true);
    if (this.onQzResize) window.removeEventListener('resize', this.onQzResize);
    if (this.qz && this.qz.open) this.qzReset();
  }
  qzSync() {
    if (!this.qz) return;
    const e = this.qzEls();
    if (this.gTimer && (!e || !this.qz.open)) this.gPause();
    if (!e) { if (this.qz.open || this.qz.busy) this.qzReset(); return; }
    if (!this.qz.open && !this.qz.busy && !e.pop.inert) e.pop.inert = true;
  }
  qzFit() {
    const vw = document.documentElement.clientWidth || window.innerWidth, vh = window.innerHeight;
    const narrow = vw <= 600;
    const wmax = narrow ? vw * 0.9 : 340;
    const hmax = narrow ? vh - 128 : Math.min(vh * 0.88, vh - 112);
    return Math.max(0.3, Math.min(wmax / 340, hmax / 720, narrow ? 1.1 : 1));
  }
  qzBg(on) {
    const e = this.qzEls();
    if (on && e) {
      const keep = new Set([e.veil]);
      const list = [];
      let n = e.slot;
      while (n && n.parentElement && n.id !== 'top') {
        Array.from(n.parentElement.children).forEach((c) => { if (c !== n && !keep.has(c) && !c.inert && !c.classList.contains('grain') && c.getAttribute('role') !== 'dialog') { c.inert = true; list.push(c); } });
        n = n.parentElement;
      }
      this.qz.inerted = list;
      try { document.documentElement.style.overflow = 'hidden'; } catch (err) {}
    } else {
      (this.qz.inerted || []).forEach((c) => { c.inert = false; });
      this.qz.inerted = [];
      try { document.documentElement.style.overflow = ''; } catch (err) {}
    }
  }
  qzTop(el, on) {

    const videoWide = videoWorks.filter(isWideCard).map((d, i) => Object.assign({}, d, { st: '--i: ' + (videoTall.length + i) + '; --dd: ' + d.dd + 'ms' }));
    // 首頁主視覺: all 8 works around the edges (atmosphere only). Position = anchor (% of the field) + offset in --u
    // (desktop: 1440x900 design px, mobile: 390x844). [ax, x, ay, y, height, depth 1 near / 2 mid / 3 far]; m: null = desktop only

    // slot: [ax, x, ay, y, height, depth 1 near / 2 mid / 3 far]; m: null = desktop only
    // still: true = never swapped in M3 (蒔刻 keeps its entrance poster; works without a works0 'taille' entry)
    const TL = [
      { id: 'winter', img: 'mk_su_poster', ar: '4 / 5', d: ['0%', -60, '50%', -250, 480, 1], m: ['0%', -44, '0%', 78, 204, 1] },
      { id: 'valentine', img: 'cover', ar: '4 / 5', d: ['100%', -300, '0%', 96, 330, 1], m: ['0%', 118, '0%', -50, 205, 2] },
      { id: 'sushi', img: 'cover', ar: '9 / 16', d: ['100%', -150, '50%', 0, 400, 2], m: ['0%', 104, '100%', -222, 212, 2] },
      { id: 'poster', img: 'mk_hp_stand', ar: '4 / 5', d: ['50%', -470, '100%', -210, 300, 2], m: ['0%', -40, '100%', -206, 172, 3] },
      { id: 'menu', img: 'cover', ar: '4 / 5', d: ['50%', -120, '100%', -165, 250, 3], m: null },
      { id: 'cake', img: 'cover', ar: '9 / 16', d: ['50%', -420, '0%', -110, 330, 3], m: ['100%', -94, '0%', 34, 196, 3] },
      { id: 'taille', img: 'mk_td_poster', ar: '3 / 4', still: true, d: ['50%', 280, '100%', -300, 360, 1], m: ['100%', -164, '100%', -256, 244, 1] },
      { id: 'project', img: 'cover', ar: '9 / 16', d: ['50%', 210, '0%', -140, 330, 3], m: null }
    ];
    const MK = { mk_su_poster: 'media/mk_su_poster_s.jpg', mk_hp_stand: 'media/mk_hp_stand_v2_s.jpg', mk_su_card: 'media/mk_su_card_v2_s.jpg', mk_td_poster: 'media/td_poster_mk_s.jpg' };
    const tImg = (T) => { const w = works0.find((x) => x.id === T.id); return T.img === 'cover' && w ? (w.type === 'video' ? w.img : (w.cover || w.img)) : MK[T.img]; };
    const shown = TL.map(tImg);
    const heroTiles = TL.map((T, k) => {
      const w = works0.find((x) => x.id === T.id) || null, v = !!(w && w.type === 'video'), d = T.d, m = T.m || T.d, img = tImg(T);
      // M3 alternates: other images of the same work that are not already on screen
      const alt = v || !w || T.still ? [] : [img].concat((w.pages || []).map((pg) => pg.thumb).filter((u) => u !== img && shown.indexOf(u) < 0));
      return {
        k: String(k), id: w ? w.id : T.id, isVideo: false, video: '',
        img: img,
        pages: alt.length > 1 ? alt.join('|') : '',
        cls: 'ht d' + d[5] + ' m' + m[5] + (T.m ? '' : ' mo'),
        st: '--ar: ' + T.ar + '; --ax: ' + d[0] + '; --x: ' + d[1] + '; --ay: ' + d[2] + '; --y: ' + d[3] + '; --h: ' + d[4] +
          '; --max: ' + m[0] + '; --mx: ' + m[1] + '; --may: ' + m[2] + '; --my: ' + m[3] + '; --mh: ' + m[4]
      };
    });
    // 作品總覽 row on home: all works in site order, each at its own ratio on a common height
    const rowItems = order.map((o, k) => {
      const w = o.w, v = w.type === 'video', card = works[works0.indexOf(w)];
      return {
        id: w.id, aria: card.aria, label: card.label, sub: card.sub, img: card.img, video: card.video, isVideo: v,

        enter: (e) => this.gEnter(e.currentTarget),
        leave: () => this.gLeave(),
        focus: (e) => this.gFocus(e.currentTarget)
      };
    });
    const workTabs = [{ id: 'video', label: '動態影音', count: videoWorks.length }, { id: 'print', label: '平面設計', count: printWorks.length }].map((t) => {
      const on = t.id === wt;
      return {
        label: t.label, count: String(t.count), sel: on ? 'true' : 'false',
        pick: () => this.pickTab(t.id),
        style: 'min-height: 44px; padding: 0 2px; border: none; border-bottom: 1px solid ' + (on ? '#c9a46a' : 'transparent') + '; background: none; cursor: pointer; font-family: \'Noto Serif TC\', serif; font-size: 16px; letter-spacing: 0.08em; transition: color .3s cubic-bezier(.2,.8,.2,1), border-color .3s cubic-bezier(.2,.8,.2,1); color: ' + (on ? '#ece4d8' : '#a69a8d')
      };
    });
    const menu0 = [{ name: '鴛鴦鍋底（任選兩種湯底）', price: '$180', tag: '湯' }, { name: '雪花牛', price: '$280', tag: '肉' }, { name: '綜合菜盤', price: '$120', tag: '菜' }, { name: '古早味紅茶', price: '$40', tag: '飲' }];
    const menu = menu0.map((m, i) => ({
      name: m.name, price: m.price, tag: m.tag, qty: st.qty[i],
      decLabel: '減少' + m.name, incLabel: '增加' + m.name,
      dec: () => { const q = st.qty.slice(); q[i] = Math.max(0, q[i] - 1); this.setState({ qty: q, ordered: false }); },
      inc: () => { const q = st.qty.slice(); q[i] = Math.min(9, q[i] + 1); this.setState({ qty: q, ordered: false }); }
    }));
    const items = st.qty.reduce((a, b) => a + b, 0);
    const tabs0 = [{ id: 'order', label: '先點餐' }, { id: 'video', label: '當季主打' }, { id: 'game', label: '撈丸子' }];
    const tabs = tabs0.map((t) => {
      const on = t.id === st.tab;
      return {
        label: t.label, sel: on ? 'true' : 'false',
        pick: () => { if (t.id !== 'game') { this.stopGame(); this.setState({ tab: t.id, game: false, cell: -1 }); } else this.setState({ tab: t.id }); },
        style: 'flex: 1 1 0; min-height: 40px; border: none; border-radius: 11px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700; transition: background-color .3s cubic-bezier(.2,.8,.2,1), color .3s cubic-bezier(.2,.8,.2,1); ' + (on ? 'background: #183c2e; color: #fbf0dc' : 'background: transparent; color: #183c2e')
      };
    });
    const cells = Array.from({ length: 9 }, (_, i) => ({
      on: st.game && st.cell === i,
      aria: st.game && st.cell === i ? '撈起這顆丸子' : '空的鍋位',
      hit: () => {
        if (!this.state.game || this.state.gPaused || this.state.cell !== i) return;
        this.setState({ score: this.state.score + 1, cell: -1 });
      }
    }));
    const startAhead = 4;
    const tiers0 = [{ goal: 8, prize: '兌換「手工蛋餃」或「起司球」一份（價值 $90）', short: '手工蛋餃或起司球' }, { goal: 12, prize: '兌換「古早味紅茶」兩杯（價值 $80）或「火鍋料拼盤」（價值 $150）', short: '紅茶兩杯或火鍋料拼盤' }];
    const tiers = tiers0.map((t) => {
      const got = st.best >= t.goal;
      return {
        goal: t.goal, prize: t.short, mark: got ? '✓' : '',
        style: 'display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; font-size: 13px; ' + (got ? 'background: #183c2e; color: #fbf0dc' : 'background: #183c2e0f; color: #2a1a14')
      };
    });
    const coupon = st.best >= 12 ? '「古早味紅茶」兩杯或「火鍋料拼盤」一份' : st.best >= 8 ? '「手工蛋餃」或「起司球」一份' : '';
    const nextTier = tiers0.find((t) => st.score < t.goal);
    const gameHint = st.game ? (nextTier ? '再 ' + (nextTier.goal - st.score) + ' 顆可換' + nextTier.short : '最高獎勵達成！') + '・剩 ' + Math.max(0, Math.ceil(st.left)) + ' 秒' : '12 秒內點中丸子，撈越多換越好';
    return {
      plates, works, sel, videoWorks, printWorks, videoTall, videoWide, workTabs, rowItems,
      rvDof: (this.state.rv || {}).dof ? 'is-in' : '',
      nav, entryThumbs,
      rvProblem: (this.state.rv || {}).problem ? 'is-in' : '',
      rvHow: (this.state.rv || {}).how ? 'is-in' : '',
      rvQueue: (this.state.rv || {}).queue ? 'is-in' : '',
      heroCls: 'hero3' + (this.heroOff ? ' off' : ''),
      t1: Array.from('Wei AI Visuals').map((c, i) => ({ c: c === ' ' ? '\u00a0' : c, cls: (i < 3 ? 'wi ' : '') + (this.state.intro ? 'ch' : 'ch done'), st: '--i: ' + i })),
      t2: Array.from('Portfolio').map((c, i) => ({ c, cls: this.state.intro ? 'ch' : 'ch done', st: '--i: ' + (i + 14) })),
      tagCls: 'tag ' + (this.state.intro ? 'rise' : 'rise done'),
      leadCls: 'lead ' + (this.state.intro ? 'rise' : 'rise done'),
      heroTiles,
      pageHome: curPage === 'home',
      pageWorks: curPage === 'works',
      goHome: () => go('home'),
      goWorks: () => go('works'),
      goExt: () => { go('works', () => { const el = document.getElementById('queue'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' }); }); },
      showVideo: wt === 'video',
      showPrint: wt === 'print',
      pillars: [
        { st: '--i: 0; --d0: 250ms', n: '01', title: '效率與品質並行', body: '免除複雜的租棚、搭景與餐點造型準備，根據影音內容從概念到成片縮短至 3 天至一週完成。' },
        { st: '--i: 1; --d0: 250ms', n: '02', title: '分眾情緒切角', body: 'Gen Z 族群的視覺節奏、情侶約會的氛圍色調、家庭聚餐的暖心文案，對準各族群精準溝通。' },
        { st: '--i: 2; --d0: 250ms', n: '03', title: '虛實融合的真實感', body: '能靈活結合門市空間與招牌餐點的實拍影像，透過 AI 延伸動態張力與氛圍光影，在保有純粹食慾與信任感的同時，展現豐富的視覺魅力。' },
        { st: '--i: 3; --d0: 250ms', n: '04', title: '統一的視覺識別延伸', body: '從品牌現有識別出發，無縫串聯動態影音與平面文宣（門市海報、桌上菜單），在不同媒介接觸點上建立清晰且深刻的立體印象。' }
      ],
      open: !!cur,
      gridCls: 'wgrid' + (cur && zph === 'open' ? ' zoomed' : ''),
      dzCls: 'dz' + (zph === 'open' ? ' in' : ''),
      dzSt: zph === 'pre' ? 'visibility: hidden' : 'visibility: visible',
      zfSt: (this.state.zhide ? 'visibility: hidden' : 'visibility: inherit') + (cur && cur.type !== 'video'
        ? (cur.ar ? '; --ar: ' + cur.ar + '; --arn: ' + arN(cur).toFixed(4) : '') + (cur.pages.length > 6 ? '; --pgx: 52px' : '') : ''),
      strip,
      close: () => this.closeSheet(),
      prevWork: () => this.stepWork(-1),
      nextWork: () => this.stepWork(1),
      zoom: !!(cur && this.state.zoom),
      zoomIn: () => { if (this._zSwiped) { this._zSwiped = false; return; } this.setState({ zoom: true }); },
      zoomOut: () => this.setState({ zoom: false }),
      beltDown: this.beltDown,
      beltEnter: () => { this.hover = true; this.kick(); },
      beltLeave: () => { this.hover = false; this.kick(); },
      noTicket: !st.ticket,
      hasTicket: st.ticket,
      waiting: 12,
      waitingMins: 35,
      takeTicket: () => { this.setState({ ticket: true, ahead: startAhead, called: false, tab: 'order' }); this.startQueue(); },
      cancelTicket: () => { this.stopQueue(); this.stopGame(); this.setState({ ticket: false, called: false, game: false, cell: -1, qty: [0, 0, 0, 0], ordered: false, best: 0, score: 0, left: 12 }); },
      fastForward: () => this.stepQueue(),
      ticketNo: '047',
      ahead: st.ahead,
      mins: st.ahead * 3,
      rollClass: st.ahead % 2 ? 'rollA' : 'rollB',
      progress: String((startAhead - st.ahead) / startAhead),
      isCalled: st.called,
      tabs,
      tabOrder: st.tab === 'order',
      tabVideo: st.tab === 'video',
      tabGame: st.tab === 'game',
      menu,
      orderLabel: st.ordered ? '已預點 ' + items + ' 項，入座後直接上菜' : items ? '送出預點（' + items + ' 項）' : '選好再送出',
      submitOrder: () => { if (items) { this.setState({ ordered: true }); } },
      cells, tiers, coupon, gameHint,
      queueVideo: A.hotpot.video,
      queuePoster: A.hotpot.img,
      hasCoupon: !!coupon,
      seasonal: [
        { name: '紅白聖誕圍爐雙人套餐', price: '$999', note: '原價 $1,280・含蕃茄起司鍋＋牛奶鍋底、雪花牛、聖誕樹花椰、星星紅蘿蔔、雪人魚丸' },
        { name: '每日限量早鳥禮', price: '價值 $380', note: '每日前 10 組加贈「海鮮拼盤」' },
        { name: '加點推薦：手工蛋餃', price: '$90', note: '' }
      ].map((m) => Object.assign({}, m, { hasNote: !!m.note })),
      score: st.score,
      gameLabel: st.left === 0 ? '再玩一次' : '開始（12 秒）',
      gameIdle: !st.game,
      startGame: () => { if (!this.state.game) this.startGame(); },
    };
  }
}

;WeiRuntime.mount({ template: document.getElementById('wei-tpl').textContent, logic: Component });
